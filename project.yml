name: Folio
options:
  bundleIdPrefix: com.folio
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: NO
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.5.0
targets:
  Folio:
    type: application
    platform: iOS
    sources: [Folio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folio.reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
  FolioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FolioTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Folio
schemes:
  Folio:
    build:
      targets:
        Folio: all
    test:
      targets: [FolioTests]
